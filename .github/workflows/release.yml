name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-packages:
    name: Build Wheel, Source Dist & Zipapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and verify tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build
          pytest
      - name: Build sdist, wheel, and standalone zipapp
        run: |
          python -m build
          python scripts/build_zipapp.py -o dist/ggrompatcher.pyz
          python dist/ggrompatcher.pyz --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  standalone-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            ext: ""
          - os: windows-latest
            target: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target: macos-arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Build standalone CLI+GUI binary
        run: |
          pyinstaller --onefile --name ggrompatcher-${{ matrix.target }} --paths src src/ggrompatcher/__main__.py
      - name: Smoke test built binary
        shell: bash
        run: |
          ./dist/ggrompatcher-${{ matrix.target }}${{ matrix.ext }} --help
          ./dist/ggrompatcher-${{ matrix.target }}${{ matrix.ext }} decode -s gb 004-BCE-E66
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/ggrompatcher-${{ matrix.target }}${{ matrix.ext }}

  publish:
    name: Publish GitHub Release
    needs: [python-packages, standalone-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
