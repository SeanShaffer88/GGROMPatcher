[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ggrompatcher"
version = "0.1.0"
description = "Cross-platform Game Genie/PAR/GSA ROM patcher, IPS/BPS/UPS/PPF/APS patch tool, checksum fixer, and ROM DAT verifier with Desktop GUI and CLI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Sean Shaffer" },
]
keywords = [
    "game-genie",
    "rom-patcher",
    "gameboy",
    "gba",
    "nes",
    "snes",
    "genesis",
    "gamegear",
    "ips",
    "bps",
    "ups",
    "ppf",
    "aps",
    "nointro",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dnd = [
    "tkinterdnd2>=0.4",
]
build = [
    "build>=1.0",
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
ggrompatcher = "ggrompatcher.cli:main"

[project.gui-scripts]
ggrompatcher-gui = "ggrompatcher.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
warn_unused_configs = true
disallow_any_generics = true
